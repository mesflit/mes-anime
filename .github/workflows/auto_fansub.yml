name: Otomatik Fansub Pipeline

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Repoyu Çek
        uses: actions/checkout@v4
      - name: Bağımlılıkları Kur
        run: |
          sudo apt-get update
          sudo apt-get install -y aria2 ffmpeg python3-pip
          pip install feedparser requests deep-translator
      - name: Pipeline Çalıştır
        env:
          UPLOAD_API_KEY: ${{ secrets.UPLOAD_API_KEY }}
        run: python3 scripts/pipeline.py
      - name: Veritabanını Güncelle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "chore: yeni anime bölümleri eklendi" || exit 0
          git push
