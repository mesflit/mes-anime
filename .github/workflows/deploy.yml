name: Şifreli Siteyi Yayınla

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Secret Key Enjekte Et
        env:
          VIDEO_SECRET_KEY: ${{ secrets.VIDEO_SECRET_KEY }}
        run: |
          mkdir -p _site
          cp -r index.html data _site/
          [ -d videos ] && cp -r videos _site/ || true
          sed -i "s|__VIDEO_SECRET_KEY__|${VIDEO_SECRET_KEY}|g" _site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
