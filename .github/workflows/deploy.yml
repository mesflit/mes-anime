name: Şifreli Siteyi Yayınla

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Secret Key Enjekte Et
        env:
          VIDEO_SECRET_KEY: ${{ secrets.VIDEO_SECRET_KEY }}
        run: |
          mkdir -p _site
          cp -r index.html data videos _site/ 2>/dev/null || true
          sed -i "s|__VIDEO_SECRET_KEY__|${VIDEO_SECRET_KEY}|g" _site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"
      - id: deployment
        uses: actions/deploy-pages@v4
