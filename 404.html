<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sayfa bulunamadı | mes-anime</title>
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#0b0d12" />
  <link rel="icon" href="/mes-anime/assets/icons/icon.svg" type="image/svg+xml" />
  <script>
    // Eski tarz linkleri (/mes-anime/izle/opm/s1-ep1) yeni adrese (#/izle/...) yönlendir
    (function () {
      var m = location.pathname.match(/^(\/[^/]+\/)?(izle\/.+)$/);
      if (m) location.replace((m[1] || "/") + "#/" + m[2]);
    })();
  </script>
  <style>
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; text-align: center;
           background: #0b0d12; color: #eef1f7; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; padding: 16px; }
    img { width: 96px; height: 96px; }
    h1 { font-size: 1.4rem; margin: 18px 0 8px; }
    p { color: #8b95a7; margin: 0 0 22px; }
    a { display: inline-block; background: #e50914; color: #fff; text-decoration: none; font-weight: 600; padding: 10px 18px; border-radius: 8px; }
  </style>
</head>
<body>
  <main>
    <img src="/mes-anime/assets/icons/icon.svg" alt="" />
    <h1>Sayfa bulunamadı</h1>
    <p>Aradığın sayfa taşınmış ya da hiç olmamış olabilir.</p>
    <a href="/mes-anime/">Ana sayfaya dön</a>
  </main>
</body>
</html>
