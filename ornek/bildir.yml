# Bu dosyayı VİDEO DEPOSUNA (ör. opm) şu yola kopyala:
#   .github/workflows/bildir.yml
# Video deposu push edilince mes-anime'ye haber verir, o da yeni bölümleri siteye ekler.
# Gerekli: video deposunda MES_ANIME_TOKEN adlı secret (README: "Push edilince güncelleme").
name: mes-anime'ye haber ver

on:
  push:
    branches: [main]

jobs:
  bildir:
    runs-on: ubuntu-latest
    steps:
      - run: gh api repos/mesflit/mes-anime/dispatches -f event_type=yeni-bolum
        env:
          GH_TOKEN: ${{ secrets.MES_ANIME_TOKEN }}
