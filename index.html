<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>mes-anime</title>
  <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />
  <style>
    :root {
      --bg: #0b0d12; --card: #151923; --border: #232938;
      --text: #eef1f7; --muted: #8b95a7; --accent: #e50914;
      --plyr-color-main: #e50914;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, sans-serif; min-height: 100vh; }
    header {
      position: sticky; top: 0; z-index: 20; background: rgba(11,13,18,.92);
      backdrop-filter: blur(10px); border-bottom: 1px solid var(--border);
      padding: 14px 20px; display: flex; gap: 14px; align-items: center; flex-wrap: wrap;
    }
    .logo { font-size: 1.3rem; font-weight: 800; letter-spacing: -.5px; cursor: pointer; }
    .logo span { color: var(--accent); }
    .search {
      flex: 1; min-width: 180px; max-width: 380px; margin-left: auto;
      background: var(--card); border: 1px solid var(--border); color: var(--text);
      padding: 9px 14px; border-radius: 8px; outline: none; font-size: .95rem;
    }
    .search:focus { border-color: var(--accent); }
    main { max-width: 1200px; margin: 0 auto; padding: 24px 16px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 18px; }
    .card {
      background: var(--card); border: 1px solid var(--border); border-radius: 12px;
      overflow: hidden; cursor: pointer; transition: transform .18s, border-color .18s;
    }
    .card:hover { transform: translateY(-4px); border-color: var(--accent); }
    .poster {
      aspect-ratio: 2/3; background: linear-gradient(135deg, #1f2638, #11141d);
      background-size: cover; background-position: center; position: relative;
      display: flex; align-items: center; justify-content: center; font-weight: 700; color: var(--muted);
    }
    .badge {
      position: absolute; top: 8px; right: 8px; background: rgba(0,0,0,.78);
      padding: 3px 8px; border-radius: 6px; font-size: .75rem; color: #fff;
    }
    .card-body { padding: 12px; }
    .card-title { font-weight: 700; font-size: .98rem; margin-bottom: 4px; }
    .card-meta { font-size: .8rem; color: var(--muted); }
    /* Watch View */
    .watch-wrap { display: grid; grid-template-columns: 1fr 300px; gap: 20px; align-items: start; }
    @media (max-width: 860px) { .watch-wrap { grid-template-columns: 1fr; } }
    .player-box { background: #000; border-radius: 12px; overflow: hidden; border: 1px solid var(--border); }
    .watch-bar {
      display: flex; justify-content: space-between; align-items: center; gap: 10px;
      margin-top: 14px; flex-wrap: wrap;
    }
    .btn {
      background: var(--card); color: var(--text); border: 1px solid var(--border);
      padding: 8px 14px; border-radius: 8px; cursor: pointer; font-size: .9rem; font-weight: 600;
    }
    .btn:hover { border-color: var(--accent); }
    .btn-accent { background: var(--accent); border-color: var(--accent); color: #fff; }
    .ep-panel {
      background: var(--card); border: 1px solid var(--border); border-radius: 12px;
      padding: 14px; max-height: 540px; overflow-y: auto;
    }
    .ep-panel h3 { font-size: .95rem; margin-bottom: 10px; color: var(--muted); }
    .ep-item {
      width: 100%; text-align: left; background: transparent; color: var(--text);
      border: 1px solid transparent; padding: 10px 12px; border-radius: 8px;
      cursor: pointer; margin-bottom: 6px; font-size: .9rem; display: block;
    }
    .ep-item:hover { background: #1d2332; }
    .ep-item.active { background: rgba(229,9,20,.15); border-color: var(--accent); font-weight: 700; }
    .hidden { display: none !important; }
    .empty { text-align: center; color: var(--muted); padding: 60px 20px; }
  </style>
</head>
<body>
  <header>
    <div class="logo" onclick="showHome()">mes<span>-anime</span></div>
    <input id="search" class="search" type="search" placeholder="Anime ara..." oninput="renderHome()" />
  </header>

  <main>
    <section id="homeView">
      <div id="animeGrid" class="grid"></div>
      <div id="emptyState" class="empty hidden">Henüz anime eklenmemiş.</div>
    </section>

    <section id="watchView" class="hidden">
      <div style="margin-bottom: 14px;">
        <button class="btn" onclick="showHome()">← Geri Dön</button>
      </div>
      <div class="watch-wrap">
        <div>
          <div class="player-box">
            <video id="video" playsinline controls crossorigin="anonymous"></video>
          </div>
          <div class="watch-bar">
            <div>
              <h2 id="watchTitle" style="font-size:1.15rem;"></h2>
              <div id="watchSub" style="font-size:.85rem;color:var(--muted);margin-top:2px;"></div>
            </div>
            <div style="display:flex;gap:8px;">
              <button id="prevBtn" class="btn">← Önceki</button>
              <button id="nextBtn" class="btn btn-accent">Sonraki →</button>
            </div>
          </div>
        </div>
        <aside class="ep-panel">
          <h3>Bölümler</h3>
          <div id="epList"></div>
        </aside>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>
  <script src="https://cdn.plyr.io/3.7.8/plyr.polyfilled.js"></script>
  <script>
    const SECRET_KEY = "__VIDEO_SECRET_KEY__";
    let AES_KEY_BUF = null;
    let ANIMES = [];
    let hls = null;
    let player = null;

    async function initKey() {
      const hash = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(SECRET_KEY));
      AES_KEY_BUF = hash.slice(0, 16);
    }

    // HLS.js özel yükleyici: "enc.key" isteğini ağa çıkmadan bellekten verir
    class KeyInterceptLoader extends Hls.DefaultConfig.loader {
      load(context, config, callbacks) {
        if (context.url && context.url.endsWith("enc.key")) {
          const stats = { trequest: performance.now(), tfirst: performance.now(), tload: performance.now(), loaded: 16, total: 16 };
          setTimeout(() => callbacks.onSuccess({ url: context.url, data: AES_KEY_BUF }, stats, context, null), 0);
          return;
        }
        super.load(context, config, callbacks);
      }
    }

    async function boot() {
      await initKey();
      try {
        const res = await fetch("data/animes.json?t=" + Date.now());
        ANIMES = await res.json();
      } catch { ANIMES = []; }
      renderHome();
    }

    function showHome() {
      if (hls) { hls.destroy(); hls = null; }
      document.getElementById("watchView").classList.add("hidden");
      document.getElementById("homeView").classList.remove("hidden");
    }

    function renderHome() {
      const q = document.getElementById("search").value.toLowerCase().trim();
      const list = ANIMES.filter(a => a.title.toLowerCase().includes(q) || (a.category || "").toLowerCase().includes(q));
      const grid = document.getElementById("animeGrid");
      const empty = document.getElementById("emptyState");
      grid.innerHTML = "";
      empty.classList.toggle("hidden", list.length > 0);

      list.forEach(anime => {
        const card = document.createElement("div");
        card.className = "card";
        card.onclick = () => openAnime(anime, 0);
        const bgStyle = anime.poster ? `style="background-image:url('${anime.poster}')"` : "";
        card.innerHTML = `
          <div class="poster" ${bgStyle}>
            ${anime.poster ? "" : anime.title}
            <span class="badge">${anime.episodes.length} Bölüm</span>
          </div>
          <div class="card-body">
            <div class="card-title">${anime.title}</div>
            <div class="card-meta">${anime.category || "Anime"}</div>
          </div>`;
        grid.appendChild(card);
      });
    }

    function openAnime(anime, epIndex) {
      document.getElementById("homeView").classList.add("hidden");
      document.getElementById("watchView").classList.remove("hidden");

      const ep = anime.episodes[epIndex];
      document.getElementById("watchTitle").textContent = `${anime.title} — ${ep.title}`;
      document.getElementById("watchSub").textContent = anime.category || "";

      const prevBtn = document.getElementById("prevBtn");
      const nextBtn = document.getElementById("nextBtn");
      prevBtn.disabled = epIndex <= 0;
      nextBtn.disabled = epIndex >= anime.episodes.length - 1;
      prevBtn.onclick = () => openAnime(anime, epIndex - 1);
      nextBtn.onclick = () => openAnime(anime, epIndex + 1);

      const epList = document.getElementById("epList");
      epList.innerHTML = "";
      anime.episodes.forEach((e, i) => {
        const b = document.createElement("button");
        b.className = "ep-item" + (i === epIndex ? " active" : "");
        b.textContent = e.title;
        b.onclick = () => openAnime(anime, i);
        epList.appendChild(b);
      });

      loadVideo(ep);
    }

    function loadVideo(ep) {
      if (hls) { hls.destroy(); hls = null; }
      if (player) { player.destroy(); player = null; }

      const box = document.querySelector(".player-box");
      box.innerHTML = `<video id="video" playsinline controls crossorigin="anonymous"></video>`;
      const video = document.getElementById("video");

      (ep.subtitles || []).forEach((s, idx) => {
        const track = document.createElement("track");
        track.kind = "captions";
        track.label = s.label;
        track.srclang = s.lang;
        track.src = s.src;
        if (idx === 0) track.default = true;
        video.appendChild(track);
      });

      if (Hls.isSupported()) {
        hls = new Hls({ loader: KeyInterceptLoader });
        hls.loadSource(ep.m3u8);
        hls.attachMedia(video);
      } else if (video.canPlayType("application/vnd.apple.mpegurl")) {
        video.src = ep.m3u8;
      }

      player = new Plyr(video, {
        captions: { active: true, update: true, language: "auto" },
        controls: ["play-large", "play", "progress", "current-time", "mute", "volume", "captions", "settings", "pip", "fullscreen"]
      });
    }

    boot();
  </script>
</body>
</html>
