<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>mes-anime</title>
  <meta name="description" content="mes-anime — Türkçe altyazılı anime izle. Kaldığın yerden devam et, bölüm indir." />
  <meta name="theme-color" content="#0b0d12" />
  <meta name="color-scheme" content="dark" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />

  <!-- Simge ve uygulama olarak yükleme (ana ekrana ekle) -->
  <link rel="icon" href="assets/icons/favicon.ico" sizes="48x48" />
  <link rel="icon" href="assets/icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png" />
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="mes-anime" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

  <!-- Link paylaşınca çıkan önizleme (WhatsApp, Telegram, X, Discord) -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="mes-anime" />
  <meta property="og:title" content="mes-anime" />
  <meta property="og:description" content="Türkçe altyazılı anime izle." />
  <meta property="og:locale" content="tr_TR" />
  <meta property="og:url" content="https://mesflit.github.io/mes-anime/" />
  <meta property="og:image" content="https://mesflit.github.io/mes-anime/assets/icons/og.jpg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="twitter:card" content="summary_large_image" />

  <!-- Dış kaynaklara erken bağlan (daha hızlı açılış) -->
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link rel="preconnect" href="https://raw.githubusercontent.com" crossorigin />

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/plyr@3.7.8/dist/plyr.css" />
  <link rel="stylesheet" href="assets/css/temel.css?v=__SURUM__" />
  <link rel="stylesheet" href="assets/css/anasayfa.css?v=__SURUM__" />
  <link rel="stylesheet" href="assets/css/izleme.css?v=__SURUM__" />
</head>
<body>
  <a class="skip" href="#main">İçeriğe geç</a>

  <header>
    <a class="logo" href="#/" aria-label="mes-anime ana sayfa"><img src="assets/icons/icon.svg" alt="" width="28" height="28" /><strong>mes<span>-anime</span></strong></a>
    <input id="search" class="search" type="search" placeholder="Anime ara..." autocomplete="off" aria-label="Anime ara" />
  </header>

  <main id="main">
    <noscript><p class="empty">Bu site için JavaScript açık olmalı.</p></noscript>

    <section id="homeView" aria-label="Ana sayfa">
      <div id="continueRow" class="row hidden">
        <h2 class="section">İzlemeye Devam Et</h2>
        <div id="continueGrid" class="grid"></div>
      </div>
      <div class="row">
        <h2 class="section">Tüm Animeler</h2>
        <div id="animeGrid" class="grid"></div>
        <div id="emptyState" class="empty" role="status" aria-live="polite"><div class="spinner" aria-hidden="true"></div>Animeler yükleniyor...</div>
      </div>
    </section>

    <section id="watchView" class="hidden" aria-label="Bölüm izle">
      <div class="back"><a class="btn" href="#/">← Geri Dön</a></div>
      <div class="watch-wrap">
        <div>
          <div class="player-box" id="playerBox"></div>
          <div class="watch-bar">
            <div>
              <h1 id="watchTitle"></h1>
              <div id="watchSub" class="sub"></div>
            </div>
            <div class="btns">
              <label class="toggle"><input type="checkbox" id="autoNext" /> Otomatik sonraki</label>
              <div id="dlBar" class="dl"></div>
              <button id="prevBtn" class="btn">← Önceki</button>
              <button id="nextBtn" class="btn btn-accent">Sonraki →</button>
            </div>
          </div>
        </div>
        <aside class="ep-panel" aria-label="Bölümler">
          <h2>Bölümler</h2>
          <div id="seasonTabs" class="tabs"></div>
          <div id="epList" class="ep-list"></div>
        </aside>
      </div>
    </section>
  </main>

  <footer>
    <div><strong>mes-anime</strong> · Türkçe altyazılı anime</div>
    <div class="kisayollar">Kısayollar: <kbd>Boşluk</kbd> oynat/durdur · <kbd>←</kbd><kbd>→</kbd> 10 sn · <kbd>F</kbd> tam ekran · <kbd>C</kbd> altyazı · <kbd>Shift</kbd>+<kbd>N</kbd>/<kbd>P</kbd> sonraki/önceki bölüm</div>
  </footer>

  <!-- Video şifre anahtarı: deploy.yml yayınlarken GitHub secret'ı ile doldurur.
       Bu satırın biçimini değiştirme: mes.py anahtar ve resize.py anahtarı buradan okur. -->
  <script>
    const SECRET_KEY = "__VIDEO_SECRET_KEY__";
  </script>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/plyr@3.7.8/dist/plyr.polyfilled.min.js"></script>
  <script type="module" src="assets/js/uygulama.js?v=__SURUM__"></script>
</body>
</html>
